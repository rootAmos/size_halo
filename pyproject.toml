[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aircraft-closure"
version = "0.1.0"
description = "Symbolic hybrid-electric VTOL aircraft closure components"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["aerosandbox>=4.2.8,<5"]

[dependency-groups]
dev = ["pyyaml>=6,<7"]
notebooks = ["jupyterlab>=4,<5"]

[tool.setuptools.packages.find]
where = ["src"]
