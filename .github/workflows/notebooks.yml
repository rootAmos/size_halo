name: notebooks

on:
  workflow_dispatch:
    inputs:
      notebooks:
        description: "Glob of notebooks to execute (default: all)"
        default: "notebooks/*.ipynb"

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      notebooks: ${{ steps.find.outputs.notebooks }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          echo "notebooks=$(ls ${{ inputs.notebooks }} | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  execute:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 90           # per notebook; each one is its own job
    strategy:
      fail-fast: false
      matrix:
        notebook: ${{ fromJson(needs.list.outputs.notebooks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install (locked, with notebooks group)
        run: uv sync --locked --group notebooks
      - name: Execute ${{ matrix.notebook }}
        run: |                          # the kernel's inline backend embeds the plots
          uv run jupyter nbconvert --to notebook --execute "${{ matrix.notebook }}" --inplace \
            --ExecutePreprocessor.timeout=5400
      - name: Name the artifact
        id: name
        run: echo "name=$(basename '${{ matrix.notebook }}' .ipynb)-$(basename "$(dirname '${{ matrix.notebook }}')")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ steps.name.outputs.name }}
          path: ${{ matrix.notebook }}
