name: notebooks

on:
  workflow_dispatch:

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install (locked, with notebooks group)
        run: uv sync --locked --group notebooks
      - name: Execute every verification notebook
        env:
          MPLBACKEND: Agg
        run: |
          set -e
          mkdir -p executed
          for notebook in notebooks/tier*/*.ipynb; do
            echo "::group::$notebook"
            uv run jupyter nbconvert --to notebook --execute "$notebook" \
              --output-dir executed --output "$(basename "$notebook")" --ExecutePreprocessor.timeout=1800
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: executed-notebooks
          path: executed/
